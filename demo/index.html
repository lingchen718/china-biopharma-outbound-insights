<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中国生物医药出海交易洞察 · Demo</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root {
    --bg: #0b1120;
    --card: #111827;
    --card-2: #0f172a;
    --line: #223047;
    --ink: #e6edf3;
    --ink-2: #cbd5e1;
    --muted: #8b9bb0;
    --accent: #2dd4bf;
    --accent-2: #5eead4;
    --accent-soft: #0d2f2b;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px; -webkit-font-smoothing: antialiased;
  }
  .topbar { position: sticky; top: 0; z-index: 40; background: rgba(13,19,34,.92); backdrop-filter: saturate(150%) blur(8px); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 1480px; margin: 0 auto; padding: 12px 24px 10px; display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand .logo { width: 34px; height: 34px; flex: 0 0 auto; border-radius: 10px; background: linear-gradient(135deg, var(--accent), #0891b2); color: #06211d; display: grid; place-items: center; font-weight: 800; font-size: 16px; }
  .brand h1 { font-size: 16px; margin: 0; letter-spacing: .2px; white-space: nowrap; }
  .brand p { margin: 2px 0 0; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .nav { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-start; }
  .nav button { border: 0; background: transparent; color: var(--ink-2); padding: 8px 12px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .nav button:hover { background: #16233b; color: var(--ink); }
  .nav button.active { background: var(--accent); color: #06211d; font-weight: 700; }
  .filterbar { position: relative; z-index: 30; background: #0f172a; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .filterbar-inner { max-width: 1480px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .fgroup { display: flex; align-items: center; gap: 6px; position: relative; }
  .fgroup > label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .dd-btn { border: 1px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 9px; padding: 6px 10px; cursor: pointer; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dd-btn:hover { border-color: #38506e; }
  .dd-btn .n { color: var(--accent); font-weight: 600; }
  .dd-menu { position: absolute; top: 34px; left: 0; min-width: 220px; max-height: 340px; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; z-index: 50; display: none; }
  .dd-menu.open { display: block; }
  .dd-menu label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
  .dd-menu label:hover { background: #16233b; }
  .dd-menu .dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
  .f-reset { border: 0; background: transparent; color: var(--accent-2); cursor: pointer; font-size: 12.5px; padding: 6px 8px; }
  .f-reset:hover { text-decoration: underline; }

  main { max-width: 1480px; margin: 0 auto; padding: 20px 24px 60px; }
  .page-title { margin: 4px 0 16px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .page-title h2 { margin: 0; font-size: 20px; }
  .page-title p { margin: 0; color: var(--muted); font-size: 13px; }
  .dimension-bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; font-size: 11.5px; color: var(--muted); }
  .dimension-bar .seg { padding: 3px 9px; border: 1px solid var(--line); border-radius: 20px; }

  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .kpi .label { font-size: 12px; color: var(--muted); }
  .kpi .value { font-size: 24px; font-weight: 700; margin-top: 6px; letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
  .kpi .sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g3 { grid-template-columns: 1fr 1fr 1fr; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 4px; font-size: 14.5px; color: var(--ink); }
  .card .hint { color: var(--muted); font-size: 12px; margin: 0 0 10px; line-height: 1.5; }
  .chart { width: 100%; }
  .ch-sm { height: 220px; } .ch-md { height: 280px; } .ch-lg { height: 340px; }

  .metric-switch, .dim-switch { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .metric-switch button, .dim-switch button { border: 1px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  .metric-switch button.active, .dim-switch button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-2); font-weight: 600; }

  table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.tbl th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.tbl td { padding: 8px; border-bottom: 1px solid #17233a; vertical-align: top; }
  table.tbl tbody tr { cursor: pointer; }
  table.tbl tbody tr:hover { background: #16233b; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11.5px; white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; }
  .leader { display: flex; gap: 14px; flex-wrap: wrap; }
  .leader .side { flex: 1; min-width: 360px; }

  .footprint { display: grid; grid-template-columns: repeat(auto-fill,minmax(158px,1fr)); gap: 10px; }
  .fp-tile { border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; background: var(--card-2); transition: .15s; position: relative; }
  .fp-tile:hover { border-color: var(--c); box-shadow: var(--shadow); transform: translateY(-1px); }
  .fp-tile.active { border-color: var(--c); }
  .fp-tile.active::after { content: '✓ 已筛选'; position: absolute; top: 8px; right: 10px; font-size: 11px; color: var(--c); font-weight: 700; }
  .fp-flag { font-size: 20px; } .fp-region { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .fp-name { font-weight: 600; margin-top: 5px; font-size: 13px; color: var(--ink); }
  .fp-n { font-size: 18px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .fp-v { font-size: 11px; color: var(--muted); }
  .fp-bar { height: 4px; border-radius: 2px; background: #1d2a40; margin-top: 8px; overflow: hidden; }
  .fp-bar span { display: block; height: 100%; border-radius: 2px; }

  .insight { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 9px 12px; font-size: 12.5px; color: var(--ink-2); margin-top: 10px; line-height: 1.55; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .duo > div { position: relative; }
  .duo .cap { text-align: center; font-size: 11px; color: var(--muted); margin-top: 4px; }

  .size-legend { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin: 6px 0 2px; }
  .size-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .size-legend i { border-radius: 50%; display: inline-block; background: rgba(45,212,191,.45); border: 1px solid var(--accent); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; display: none; align-items: center; justify-content: center; padding: 24px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 16px; max-width: 700px; width: 100%; max-height: 86vh; overflow: auto; padding: 22px; box-shadow: 0 24px 80px rgba(0,0,0,.5); }
  .modal .x { float: right; border: 0; background: #16233b; color: var(--ink-2); border-radius: 8px; cursor: pointer; width: 28px; height: 28px; }
  .deal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .deal-head .vs { color: var(--muted); font-weight: 600; }
  .fact { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 18px; margin: 14px 0; }
  .fact div { font-size: 13px; color: var(--ink); }
  .fact .k { color: var(--muted); font-size: 11.5px; display: block; }
  .note { background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; color: var(--ink-2); line-height: 1.6; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #0b1120; padding: 8px 14px; border-radius: 9px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 200; }
  .toast.show { opacity: 1; }

  @media (max-width: 1100px) {
    .kpis { grid-template-columns: repeat(3, 1fr); }
    .g2, .g3 { grid-template-columns: 1fr; }
    .duo { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo">药</div>
        <div>
          <h1>中国生物医药出海交易洞察</h1>
          <p>China Biopharma Licensing-out Deal Intelligence · 2019–2026 YTD · 演示 Demo</p>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
    </div>
    <div class="filterbar"><div class="filterbar-inner" id="filterbar"></div></div>
  </header>

  <main id="main"></main>

  <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>

<script>

// ===== 常量与中英对照 =====
const MODS = [
  {k:'ADC', label:'ADC 抗体偶联药物', c:'#2dd4bf'},
  {k:'Bispecific', label:'双抗 Bispecific', c:'#60a5fa'},
  {k:'mAb', label:'单抗 mAb', c:'#c084fc'},
  {k:'Small molecule', label:'小分子 Small molecule', c:'#fbbf24'},
  {k:'CAR-T / Cell', label:'细胞疗法 CAR-T/Cell', c:'#f87171'},
  {k:'Peptide/Protein', label:'多肽/蛋白 Peptide/Protein', c:'#34d399'},
  {k:'Vaccine', label:'疫苗 Vaccine', c:'#22d3ee'},
  {k:'Other', label:'其他 Other', c:'#94a3b8'}
];
const MODMAP = Object.fromEntries(MODS.map(m => [m.k, m]));
const INDS = ['Oncology','Autoimmune','CNS','Metabolic','Infectious','Rare disease','Vaccine','Other'];
const IND_LABEL = {'Oncology':'肿瘤 Oncology','Autoimmune':'自免 Autoimmune','CNS':'中枢神经 CNS','Metabolic':'代谢 Metabolic','Infectious':'感染 Infectious','Rare disease':'罕见病 Rare disease','Vaccine':'疫苗 Vaccine','Other':'其他 Other'};
const STAGES = ['Preclinical','IND approved','Phase I','Phase II','Phase III','Registration','Marketed','Multiple Stages','Unknown'];
const STAGE_LABEL = {'Preclinical':'临床前 Preclinical','IND approved':'IND 获批','Phase I':'I 期 Phase I','Phase II':'II 期 Phase II','Phase III':'III 期 Phase III','Registration':'注册阶段 Registration','Marketed':'已上市 Marketed','Multiple Stages':'多阶段 Multiple Stages','Unknown':'未知 Unknown'};
const DTYPES = ['License-out','Co-development','Asset transfer','Non-exclusive','Option','M&A','JV','Other'];
const DTYPE_LABEL = {'License-out':'对外授权 License-out','Co-development':'合作开发 Co-development','Asset transfer':'资产转让 Asset transfer','Non-exclusive':'非独占许可 Non-exclusive','Option':'期权协议 Option','M&A':'并购 M&A','JV':'合资 JV','Other':'其他 Other'};
const REGIONS = ['US & Canada','Europe','APAC','Emerging Markets','Global','Other'];
const REGION_LABEL = {'US & Canada':'美国+加拿大 US & Canada','Europe':'欧洲 Europe','APAC':'亚太 APAC','Emerging Markets':'新兴市场 Emerging Markets','Global':'全球 Global','Other':'其他 Other'};
const CONF = ['high','high','medium','medium','low'];

function labelOf(dim, v){
  if(dim==='modality') return MODMAP[v] ? MODMAP[v].label : v;
  if(dim==='indication') return IND_LABEL[v] || v;
  if(dim==='stage') return STAGE_LABEL[v] || v;
  if(dim==='dealType') return DTYPE_LABEL[v] || v;
  if(dim==='region') return REGION_LABEL[v] || v;
  return v;
}

const COUNTRY_REGION = {
  'United States':'US & Canada','Canada':'US & Canada',
  'Germany':'Europe','United Kingdom':'Europe','Switzerland':'Europe','France':'Europe',
  'Japan':'APAC','South Korea':'APAC','Singapore':'APAC','Australia':'APAC',
  'Indonesia':'Emerging Markets','India':'Emerging Markets','Brazil':'Emerging Markets',
  'Global':'Global'
};
const COUNTRY_FLAGS = {'United States':'🇺🇸','Canada':'🇨🇦','Germany':'🇩🇪','United Kingdom':'🇬🇧','Switzerland':'🇨🇭','France':'🇫🇷','Japan':'🇯🇵','South Korea':'🇰🇷','Singapore':'🇸🇬','Australia':'🇦🇺','Indonesia':'🇮🇩','India':'🇮🇳','Brazil':'🇧🇷','Global':'🌎'};

const CN_COMPANIES = ['百济神州 BeiGene','信达生物 Innovent','成都先导 HitGen','英矽智能 Insilico','晶泰科技 XtalPi','天演药业 Adagene','绿叶制药 Luye','百奥泰 Bio-Thera','君实生物 Junshi','沃森生物 Walvax','科伦博泰 Kelun-Biotech','荣昌生物 RemeGen','石药集团 CSPC','科济药业 CARsgen','华东医药 Huadong','上海医药 Shanghai Pharma','济民可信 Jemincare','锐格医药 Regor','诺诚健华 InnoCare','海思科 Haisco'];
const OS_COMPANIES = ['Novartis','Pfizer','Merck KGaA','AstraZeneca','Johnson & Johnson','Roche','Sanofi','Eli Lilly','Gilead','Takeda','Astellas','Daiichi Sankyo','MSD','Bristol Myers Squibb','Boehringer Ingelheim','Amgen','Regeneron','Biogen','Seagen','Samsung Biologics','LG Chem','SK Bioscience','Handok','Etana'];
const TARGETS = ['PD-1','PD-L1','HER2','VEGF','CD19','BCMA','TROP2','CLDN18.2','EGFR','KRAS','GLP-1','IL-17','TNF-α','CD47','BTK','OX40'];
const ASSET_PREFIX = ['SHR','YL','AB','JS','BA','IBI','CM','RC','KD','HH'];

// ===== 可复现的伪随机 =====
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(20261019);
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
function wpick(pairs){ let s=pairs.reduce((x,p)=>x+p[1],0), r=rnd()*s; for(const p of pairs){ r-=p[1]; if(r<=0) return p[0]; } return pairs[pairs.length-1][0]; }
function round2(x){ return Math.round(x*100)/100; }
function fmtM(v){ if(v==null) return '—'; return v >= 1000 ? '$'+(v/1000).toFixed(2)+'B' : '$'+Math.round(v)+'M'; }
function fmtInt(n){ return n.toLocaleString('en-US'); }

// ===== 生成模拟数据（2019–2026）=====
const DEALS = [];
(function gen(){
  const byYear = {2019:11, 2020:14, 2021:16, 2022:22, 2023:28, 2024:30, 2025:34, 2026:14};
  let seq = 0;
  for(const y in byYear){
    for(let i=0;i<byYear[y];i++){
      seq++;
      const t = (+y - 2019)/7; // 0..1
      const disclosed = rnd() > 0.20;
      const upfront = disclosed ? round2(Math.exp(2.2 + rnd()*3.8)) : null;
      const total = disclosed ? round2(upfront * (1.3 + rnd()*5.5)) : null;
      const country = wpick([
        ['United States',.27],['Canada',.03],['Germany',.07],['United Kingdom',.05],
        ['Switzerland',.04],['France',.02],['Japan',.07],['South Korea',.06],
        ['Singapore',.03],['Australia',.03],['Indonesia',.03],['India',.03],['Brazil',.02],['Global',.20]
      ]);
      const dealType = wpick([['License-out',.52],['Co-development',.24],['Asset transfer',.06],['Non-exclusive',.05],['Option',.05],['M&A',.04],['JV',.03],['Other',.01]]);
      const month = String(1+Math.floor(rnd()*12)).padStart(2,'0');
      const day = String(1+Math.floor(rnd()*28)).padStart(2,'0');
      // 里程碑仅在可拆分时派生（M&A/JV 含股权等对价，标记 Not Derivable）
      const derivable = disclosed && dealType!=='M&A' && dealType!=='JV';
      DEALS.push({
        id: 'DEMO-' + y + '-' + String(seq).padStart(3,'0'),
        year: +y, date: y+'-'+month+'-'+day,
        licensor: pick(CN_COMPANIES), licensee: pick(OS_COMPANIES),
        asset: pick(ASSET_PREFIX)+'-'+(100+Math.floor(rnd()*900)), target: pick(TARGETS),
        modality: wpick([['ADC',.10+.15*t],['Bispecific',.08+.12*t],['mAb',.28-.10*t],['Small molecule',.26-.06*t],['CAR-T / Cell',.08],['Peptide/Protein',.08],['Vaccine',.05],['Other',.07]]),
        indication: wpick([['Oncology',.46],['Autoimmune',.12],['CNS',.09],['Metabolic',.09],['Infectious',.09],['Rare disease',.06],['Vaccine',.05],['Other',.04]]),
        stage: wpick([['Preclinical',.32-.12*t],['IND approved',.07],['Phase I',.16],['Phase II',.16],['Phase III',.13+.08*t],['Registration',.05],['Marketed',.05+.04*t],['Multiple Stages',.04],['Unknown',.02]]),
        dealType, country, region: COUNTRY_REGION[country]||'Other', confidence: pick(CONF),
        upfront, total, milestone: derivable ? round2(total-upfront) : null, milestoneDerivable: derivable, disclosed
      });
    }
  }
})();

// ===== 全局状态 =====
const state = {
  page: 'overview', years: [2019, 2026],
  dealType: new Set(DTYPES), modality: new Set(MODS.map(m=>m.k)),
  indication: new Set(INDS), stage: new Set(STAGES), region: new Set(REGIONS), search: ''
};
function filtered(){
  return DEALS.filter(d =>
    d.year >= state.years[0] && d.year <= state.years[1] &&
    state.dealType.has(d.dealType) && state.modality.has(d.modality) &&
    state.indication.has(d.indication) && state.stage.has(d.stage) && state.region.has(d.region) &&
    (state.search==='' || (d.licensor+d.licensee+d.asset+d.target+d.indication).toLowerCase().includes(state.search.toLowerCase()))
  );
}

const NAV = [
  ['overview','市场概览 Market Overview'], ['landscape','交易格局 Deal Landscape'], ['economics','交易金额 Deal Economics'],
  ['pipeline','技术与管线 Modality & Pipeline'], ['therapy','治疗领域 Therapeutic Areas'], ['companies','交易参与方 Companies'],
  ['explorer','交易数据库 Transaction Explorer']
];
const PAGE_EN = {overview:'Market performance, key events, core metrics and signals', landscape:'Deal count and upfront payment distribution across four dimensions: asset stage, modality, disease area and deal type.', economics:'Upfront, milestones, total value, disclosure rate and value distribution', pipeline:'Drug modality, mechanism, target, stage and technology momentum', therapy:'Deal activity and trends by disease area', companies:'Licensors, licensees and their deal records & ecosystem network', explorer:'Search individual deals by company, asset, target, date and deal type'};
const DIM_SEG = {overview:'市场分析', landscape:'市场分析', economics:'市场分析', pipeline:'交易内容分析', therapy:'交易内容分析', companies:'交易内容分析', explorer:'数据检索'};

// ===== 过滤器栏 =====
const FILTER_DEFS = [
  {key:'dealType', label:'Deal Type', color:k=>DTYPE_COLORS[k], values:DTYPES},
  {key:'modality', label:'Modality', color:k=>MODMAP[k]?MODMAP[k].c:'#94a3b8', values:MODS.map(m=>m.k)},
  {key:'indication', label:'Therapeutic Area', color:k=>IND_COLORS[k], values:INDS},
  {key:'stage', label:'Asset Stage', color:k=>STAGE_COLORS[k], values:STAGES},
  {key:'region', label:'Region', color:k=>REGION_COLORS[k], values:REGIONS}
];

function buildNav(){
  document.getElementById('nav').innerHTML = NAV.map(([k,l])=>`<button data-page="${k}" class="${state.page===k?'active':''}">${l}</button>`).join('');
}
function buildFilterbar(){
  const years=[2019,2020,2021,2022,2023,2024,2025,2026];
  let html = `<div class="fgroup"><label>Year</label>
    <select class="dd-btn" id="fy0">${years.map(y=>`<option ${y===state.years[0]?'selected':''}>${y}</option>`).join('')}</select>
    <span style="color:var(--muted)">—</span>
    <select class="dd-btn" id="fy1">${years.map(y=>`<option ${y===state.years[1]?'selected':''}>${y}</option>`).join('')}</select></div>`;
  for(const f of FILTER_DEFS){
    const n = state[f.key].size===f.values.length?'All':state[f.key].size+' selected';
    html += `<div class="fgroup"><label>${f.label}</label>
      <button class="dd-btn" data-dd="${f.key}">${f.label} <span class="n">${n}</span> ▾</button>
      <div class="dd-menu" data-menu="${f.key}">${f.values.map(v=>`<label><input type="checkbox" data-fk="${f.key}" data-fv="${v}" ${state[f.key].has(v)?'checked':''}> <span class="dot" style="background:${f.color(v)}"></span>${v}</label>`).join('')}</div></div>`;
  }
  html += `<button class="f-reset" id="freset">Reset</button>`;

// ===== 图表工具 =====
let chartRegistry = [];
function mount(id, option){ const el=document.getElementById(id); if(!el) return null; const c=echarts.init(el); c.setOption(option); chartRegistry.push(c); return c; }
function clearCharts(){ chartRegistry.forEach(c=>c.dispose()); chartRegistry=[]; }
const AXIS = { axisLine:{lineStyle:{color:'#2a3b55'}}, axisLabel:{color:'#8b9bb0', fontSize:11}, splitLine:{lineStyle:{color:'#1d2a40'}} };
const TOOLTIP_DARK = { backgroundColor:'#111827', borderColor:'#223047', textStyle:{color:'#e6edf3', fontSize:12} };

function colorOf(dim, v){
  if(dim==='modality') return MODMAP[v]?MODMAP[v].c:'#94a3b8';
  if(dim==='dealType') return DTYPE_COLORS[v]||'#94a3b8';
  if(dim==='stage') return STAGE_COLORS[v]||'#94a3b8';
  if(dim==='region') return REGION_COLORS[v]||'#94a3b8';
  if(dim==='indication') return IND_COLORS[v]||'#94a3b8';
  return '#94a3b8';
}
function dimValues(dim){
  if(dim==='dealType') return DTYPES; if(dim==='modality') return MODS.map(m=>m.k);
  if(dim==='indication') return INDS; if(dim==='stage') return STAGES; if(dim==='region') return REGIONS;
  return [];
}
function metricVal(d, metric){
  if(metric==='count') return 1; if(metric==='upfront') return d.upfront||0; if(metric==='total') return d.total||0; return 1;
}
const METRIC_LABEL = {count:'交易笔数 Deals', upfront:'首付款 Upfront ($M)', total:'潜在总额 Total ($M)'};

function buildTrend(deals, metric, dim){
  const years=[2019,2020,2021,2022,2023,2024,2025,2026];
  const cats = dimValues(dim);
  const series = cats.map(v=>({
    name: labelOf(dim,v), type:'line', stack:'total', smooth:true, symbol:'circle', symbolSize:6,
    areaStyle:{opacity: dim==='modality' ? .45 : .12}, lineStyle:{width:2}, color: colorOf(dim,v), emphasis:{focus:'series'},
    data: years.map(y=>{ const rows=deals.filter(d=>d.year===y && d[dim]===v); return rows.reduce((s,d)=>s+metricVal(d,metric),0); })
  }));
  return { color: cats.map(v=>colorOf(dim,v)), tooltip:{...TOOLTIP_DARK, trigger:'axis'},
    legend:{type:'scroll', bottom:0, icon:'roundRect', itemWidth:10, itemHeight:10, textStyle:{fontSize:11, color:'#cbd5e1'}, pageTextStyle:{color:'#8b9bb0'}},
    grid:{left:8,right:8,top:12,bottom:62,containLabel:true},
    xAxis:{type:'category', data:years.map(y=>'\''+String(y).slice(2)), ...AXIS},
    yAxis:{type:'value', ...AXIS, name: METRIC_LABEL[metric], nameTextStyle:{color:'#8b9bb0'}}, series };
}
function sum(a){ return a.reduce((s,d)=>s+d,0); }
function median(a){ if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y); const m=Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
function quartiles(a){ if(!a.length) return [0,0,0,0,0]; const s=[...a].sort((x,y)=>x-y); const q=p=>{const i=(s.length-1)*p; const lo=Math.floor(i), hi=Math.ceil(i); return s[lo]+(s[hi]-s[lo])*(i-lo);}; return [s[0], q(.25), q(.5), q(.75), s[s.length-1]]; }
function tagHtml(color, text){ return `<span class="tag" style="background:${color}26;color:${color}">${text}</span>`; }
function modColor(m){ return MODMAP[m]?MODMAP[m].c:'#94a3b8'; }

// ===== KPI =====
function kpiHtml(deals){
  const disc = deals.filter(d=>d.disclosed);
  const totalV = sum(disc.map(d=>d.total)), upfrontV = sum(disc.map(d=>d.upfront));
  const highest = disc.length ? Math.max(...disc.map(d=>d.total)) : 0;
  const items = [
    ['交易笔数 Deals', fmtInt(deals.length), 'Total Deals'],
    ['披露总额 Total Value', fmtM(totalV), 'Disclosed'],
    ['最高单笔 Highest', fmtM(highest), 'Highest Deal'],
    ['首付款 Upfront', fmtM(upfrontV), 'Upfront'],
    ['中国授权方 Licensors', fmtInt(new Set(deals.map(d=>d.licensor)).size), 'Licensors'],
    ['海外引进方 Overseas Licensee', fmtInt(new Set(deals.map(d=>d.licensee)).size), 'Overseas Licensee']
  ];
  return `<div class="kpis">${items.map(([l,v,s])=>`<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div><div class="sub">${s}</div></div>`).join('')}</div>`;
}

function pieCentered(data, centerTitle, centerSub){
  return { tooltip:{...TOOLTIP_DARK, trigger:'item', formatter:'{b}: {c} ({d}%)'},
    legend:{type:'scroll', bottom:0, icon:'circle', itemWidth:9, itemHeight:9, textStyle:{fontSize:10.5, color:'#cbd5e1'}},
    title:{text:centerTitle, subtext:centerSub||'', left:'center', top:'36%', textStyle:{fontSize:17, color:'#e6edf3', fontWeight:700}, subtextStyle:{fontSize:10.5, color:'#8b9bb0', lineHeight:14}},
    series:[{type:'pie', radius:['40%','64%'], center:['50%','46%'], data, label:{show:false}, emphasis:{scale:true, scaleSize:5}}]};
}
function keyInsight(deals, dim){
  const total=deals.length, disc=deals.filter(d=>d.disclosed);
  const totalUp=sum(disc.map(d=>d.upfront))||1, cov=Math.round(disc.length/total*100);
  const counts={}, ups={};
  deals.forEach(d=>{counts[d[dim]]=(counts[d[dim]]||0)+1;});
  disc.forEach(d=>{ups[d[dim]]=(ups[d[dim]]||0)+d.upfront;});
  const cats=Object.keys(counts);
  const topC=cats.slice().sort((a,b)=>counts[b]-counts[a])[0];
  const topU=Object.keys(ups).sort((a,b)=>ups[b]-ups[a])[0];
  let gap=null, gm=-1;
  cats.forEach(c=>{ const cp=counts[c]/total*100, up=ups[c]?ups[c]/totalUp*100:0; const g=Math.abs(up-cp); if(g>gm){gm=g; gap=c;} });
  const share = topU ? `，<b>${labelOf(dim,topU)}</b> 首付款占比最高（${Math.round(ups[topU]/totalUp*100)}%）` : '';
  return `Key Insight：<b>${labelOf(dim,topC)}</b> 交易数量占比最高（${Math.round(counts[topC]/total*100)}%）${share}；数量与金额占比差距最大的是 <b>${labelOf(dim,gap)}</b>。未披露首付款不计入金额占比（Upfront disclosed for ${cov}% of deals）。`;
}

    mount(`ls-count-${i}`, pieCentered(Object.entries(counts).map(([k,v])=>({name:labelOf(d.key,k), value:v, itemStyle:{color:d.color[k]||'#94a3b8'}})), deals.length, 'Deals'));

    document.getElementById(`ls-ins-${i}`).innerHTML = keyInsight(deals, d.key);
  });
}

// ===== 交易参与方（含生态网络方块）=====
let coSort='deals', coSort2='deals';
const SORT_LABELS = {deals:'交易笔数 Deals', total:'披露总额 Disclosed Value', median:'中位数金额 Median', mods:'药物形式数 Modalities', inds:'治疗领域数 Therapeutic Areas'};

function companyStats(deals, key){
  const map=new Map();
  deals.forEach(d=>{ const name=d[key];
    if(!map.has(name)) map.set(name,{name,deals:0,total:0,vals:[],mods:new Set(),inds:new Set()});
    const c=map.get(name); c.deals++; c.mods.add(d.modality); c.inds.add(d.indication); if(d.disclosed){ c.total+=d.total; c.vals.push(d.total); } });
  return [...map.values()].map(c=>({name:c.name,deals:c.deals,total:round2(c.total),median:round2(median(c.vals)),mods:c.mods.size,inds:c.inds.size}));
}
function sortCompanies(arr, sort){
  const key = sort==='median'?'median':sort==='total'?'total':sort==='mods'?'mods':sort==='inds'?'inds':'deals';
  return arr.slice().sort((a,b)=>b[key]-a[key]);
}
function leaderTableHtml(rows, sort){
  return `<select class="dd-btn" onchange="__companySort(this)">${Object.entries(SORT_LABELS).map(([k,l])=>`<option value="${k}" ${sort===k?'selected':''}>Sort by: ${l}</option>`).join('')}</select>
  <table class="tbl"><thead><tr><th>公司 Company</th><th>交易 Deals</th><th>披露总额 Disclosed Value</th><th>中位数 Median</th><th>药物形式 Modality</th><th>治疗领域 Therapeutic Area</th></tr></thead><tbody>
  ${rows.slice(0,12).map(r=>`<tr><td>${r.name}</td><td class="num">${r.deals}</td><td class="num">${fmtM(r.total)}</td><td class="num">${fmtM(r.median)}</td><td class="num">${r.mods}</td><td class="num">${r.inds}</td></tr>`).join('')}
  </tbody></table>`;
}
window.__companySort = function(sel){
  const side = sel.closest('.side').querySelector('h3').textContent.includes('中国') ? 'cn' : 'os';
  if(side==='cn') coSort=sel.value; else coSort2=sel.value; render();
};

function buildNetworkOption(deals){
  const nm=new Map(), em=new Map();
  deals.forEach(d=>{
    [['cn',d.licensor],['os',d.licensee]].forEach(([side,name])=>{ if(!nm.has(name)) nm.set(name,{name,cn:side==='cn',cnt:0}); nm.get(name).cnt++; });
    const key=d.licensor+'|'+d.licensee; if(!em.has(key)) em.set(key,{s:d.licensor,t:d.licensee,v:0}); em.get(key).v++;
  });
  const nodes=[...nm.values()].map(n=>({id:n.name,name:n.name,category:n.cn?0:1,symbolSize:12+Math.sqrt(n.cnt)*5,itemStyle:{color:n.cn?'#2dd4bf':'#60a5fa'}}));
  const edges=[...em.values()].map(e=>({source:e.s,target:e.t,value:e.v,lineStyle:{width:Math.min(1+e.v,8),color:'#334155',curveness:0.12}}));
  const option = { tooltip:{...TOOLTIP_DARK, formatter:p=>p.dataType==='edge'?`${p.data.source} ↔ ${p.data.target}<br/>交易：<b>${p.data.value}</b>`:`${p.name}<br/>交易：<b>${nm.get(p.name).cnt}</b>`},
    legend:[{data:['中国公司','海外公司'], bottom:8, textStyle:{fontSize:11, color:'#cbd5e1'}}],
    series:[{type:'graph', layout:'force', roam:true, draggable:true, force:{repulsion:260, edgeLength:110, gravity:0.08}, categories:[{name:'中国公司'},{name:'海外公司'}], label:{show:true, fontSize:10, color:'#cbd5e1'}, data:nodes, edges, emphasis:{focus:'adjacency', lineStyle:{width:6}}}]
  };
  return {option, nm};
}

function renderCompanies(deals){
  const cn=companyStats(deals,'licensor'), os=companyStats(deals,'licensee');
  const cnSorted=sortCompanies(cn,coSort), osSorted=sortCompanies(os,coSort2);
  main.innerHTML = title('交易参与方 Companies', PAGE_EN.companies) +
  `<div class="leader">
    <div class="side card"><h3>中国授权方 Licensors</h3><p class="hint">不做武断排名，可按多指标切换排序</p><div id="co-cn"></div></div>

  </div>
  <div class="card" style="margin-top:14px"><h3>公司 × 药物形式 Company × Modality</h3><p class="hint">气泡大小 = 交易笔数；颜色 = 药物形式（与全站配色一致）。Bubble size = deal count; color = modality.</p><div id="co-bubble" class="chart ch-md"></div></div>
  <div class="card" style="margin-top:14px"><h3>生态网络 Network</h3><p class="hint">节点=公司（<span style="color:#2dd4bf">● 中国</span> / <span style="color:#60a5fa">● 海外</span>），大小=交易笔数，连线=交易；可拖拽/缩放，点击节点查看公司档案</p><div id="co-net" class="chart" style="height:440px"></div></div>`;
  document.getElementById('co-cn').innerHTML = leaderTableHtml(cnSorted, coSort);
  document.getElementById('co-os').innerHTML = leaderTableHtml(osSorted, coSort2);
  // 公司 × 药物形式
  const top=cnSorted.slice(0,12); const xd=MODS.map(m=>m.k); const bub=[];
  top.forEach((c,yi)=>MODS.forEach((m,xi)=>{ const n=deals.filter(d=>d.licensor===c.name&&d.modality===m.k).length; if(n>0) bub.push({value:[xi, top.length-1-yi], n, company:c.name, modality:m.k, itemStyle:{color:m.c}}); }));
  mount('co-bubble', {
    tooltip:{...TOOLTIP_DARK, formatter:p=>`${p.data.company}<br/>${labelOf('modality',p.data.modality)}：<b>${p.data.n}</b> 笔`},
    grid:{left:8,right:8,top:12,bottom:8,containLabel:true},
    xAxis:{type:'category', data:xd.map(m=>labelOf('modality',m)), ...AXIS, axisLabel:{...AXIS.axisLabel, rotate:18}},
    yAxis:{type:'category', data:top.map(c=>c.name).reverse(), ...AXIS, axisLabel:{fontSize:11}},
    series:[{type:'scatter', data:bub, symbolSize:function(v,p){return 8+Math.sqrt(p.data.n)*7;}}]
  });
  const {option}=buildNetworkOption(deals);
  const c=mount('co-net', option);
  c.on('click', p=>{ if(p.dataType==='node') openCompany(p.name); });
}

function syncNav(){ document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.page===state.page)); }
function syncFilterbar(){
  document.querySelectorAll('[data-dd]').forEach(btn=>{ const k=btn.dataset.dd; const def=FILTER_DEFS.find(f=>f.key===k); const n=state[k].size===def.values.length?'全部':state[k].size+' 项'; btn.innerHTML=`${def.label} <span class="n">${n}</span> ▾`; });
  document.querySelectorAll('[data-fk]').forEach(cb=>{ const k=cb.dataset.fk, v=cb.dataset.fv; cb.checked=state[k].has(v); });
  document.getElementById('fy0').value=state.years[0]; document.getElementById('fy1').value=state.years[1];
}
function render(){ buildNav(); buildFilterbar(); wireNav(); wireFilterbar(); renderMain(); }
function refresh(){ syncNav(); syncFilterbar(); renderMain(); }

function wireNav(){
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{ state.page=b.dataset.page; refresh(); });
}
function wireFilterbar(){
  const bar=document.getElementById('filterbar');
  bar.querySelectorAll('[data-dd]').forEach(btn=>btn.onclick=e=>{ e.stopPropagation(); const menu=bar.querySelector(`[data-menu="${btn.dataset.dd}"]`); const was=menu.classList.contains('open'); bar.querySelectorAll('.dd-menu').forEach(m=>m.classList.remove('open')); if(!was) menu.classList.add('open'); });
  bar.querySelectorAll('[data-menu]').forEach(m=>m.addEventListener('click', e=>e.stopPropagation()));
  bar.querySelectorAll('[data-fk]').forEach(cb=>cb.onchange=()=>{ const k=cb.dataset.fk, v=cb.dataset.fv; if(cb.checked) state[k].add(v); else state[k].delete(v); refresh(); });
  document.getElementById('fy0').onchange=e=>{ state.years[0]=+e.target.value; if(state.years[0]>state.years[1]) state.years[1]=state.years[0]; refresh(); };
  document.getElementById('fy1').onchange=e=>{ state.years[1]=+e.target.value; if(state.years[1]<state.years[0]) state.years[0]=state.years[1]; refresh(); };
  document.getElementById('freset').onclick=()=>{ resetFilters(); render(); };
}
function resetFilters(){
  state.years=[2019,2026];
  state.dealType=new Set(DTYPES); state.modality=new Set(MODS.map(m=>m.k));
  state.indication=new Set(INDS); state.stage=new Set(STAGES); state.region=new Set(REGIONS); state.search='';
}
document.addEventListener('click', ()=>{ document.querySelectorAll('.dd-menu').forEach(m=>m.classList.remove('open')); });
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeDeal(); });
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'), 1800); }

// ===== 启动 =====
render();
</script>
</body>
</html>
