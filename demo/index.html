<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中国生物医药出海交易洞察 · Demo</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root {
    --bg: #0b1120;
    --card: #111827;
    --card-2: #0f172a;
    --line: #223047;
    --ink: #e6edf3;
    --ink-2: #cbd5e1;
    --muted: #8b9bb0;
    --accent: #facc15;
    --accent-2: #fde047;
    --accent-soft: #3d3300;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px; -webkit-font-smoothing: antialiased;
  }
  .topbar { position: sticky; top: 0; z-index: 40; background: rgba(13,19,34,.92); backdrop-filter: saturate(150%) blur(8px); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 1480px; margin: 0 auto; padding: 12px 24px 10px; display: flex; flex-direction: column; align-items: stretch; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand .logo { width: 34px; height: 34px; flex: 0 0 auto; border-radius: 50%; background: radial-gradient(circle at 50% 42%, #1e2a3d, #0b1120 70%); border: 1px solid rgba(250,204,21,.45); display: grid; place-items: center; overflow: hidden; box-shadow: 0 0 12px rgba(250,204,21,.35); }
  .brand .logo svg { display: block; filter: drop-shadow(0 0 3px rgba(250,204,21,.8)); }
  .brand h1 { font-size: 16px; margin: 0; letter-spacing: .2px; white-space: nowrap; }
  .brand p { margin: 2px 0 0; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .nav { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-start; }
  .nav button { border: 0; background: transparent; color: var(--ink-2); padding: 8px 12px; border-radius: 9px; cursor: pointer; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .nav button:hover { background: #16233b; color: var(--ink); }
  .nav button.active { background: var(--accent); color: #1c1700; font-weight: 700; }
  .filterbar { position: relative; z-index: 30; background: #0f172a; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .filterbar-inner { max-width: 1480px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .fgroup { display: flex; align-items: center; gap: 6px; position: relative; }
  .fgroup > label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .dd-btn { border: 1px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 9px; padding: 6px 10px; cursor: pointer; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dd-btn:hover { border-color: #38506e; }
  .dd-btn .n { color: var(--accent); font-weight: 600; }
  .dd-menu { position: absolute; top: 34px; left: 0; min-width: 220px; max-height: 340px; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; z-index: 50; display: none; }
  .dd-menu.open { display: block; }
  .dd-menu label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
  .dd-menu label:hover { background: #16233b; }
  .dd-menu .dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
  .f-reset { border: 0; background: transparent; color: var(--accent-2); cursor: pointer; font-size: 12.5px; padding: 6px 8px; }
  .f-reset:hover { text-decoration: underline; }

  main { max-width: 1480px; margin: 0 auto; padding: 20px 24px 60px; }
  .page-title { margin: 4px 0 16px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .page-title h2 { margin: 0; font-size: 20px; }
  .page-title p { margin: 0; color: var(--muted); font-size: 13px; }
  .dimension-bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; font-size: 11.5px; color: var(--muted); }
  .dimension-bar .seg { padding: 3px 9px; border: 1px solid var(--line); border-radius: 20px; }

  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .kpi .label { font-size: 12px; color: var(--muted); }
  .kpi .value { font-size: 24px; font-weight: 700; margin-top: 6px; letter-spacing: -.3px; font-variant-numeric: tabular-nums; }
  .kpi .sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g3 { grid-template-columns: 1fr 1fr 1fr; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 4px; font-size: 14.5px; color: var(--ink); }
  .card h3 .zh { color: var(--ink); }
  .card h3 .en { color: #fde68a; }
  .card .hint { color: var(--muted); font-size: 12px; margin: 0 0 10px; line-height: 1.5; }
  .chart { width: 100%; }
  .ch-sm { height: 220px; } .ch-md { height: 280px; } .ch-lg { height: 340px; }

  .metric-switch, .dim-switch { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .metric-switch button, .dim-switch button { border: 1px solid var(--line); background: var(--card); color: var(--ink-2); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  .metric-switch button.active, .dim-switch button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-2); font-weight: 600; }

  table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.tbl th { text-align: left; color: var(--muted); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.tbl td { padding: 8px; border-bottom: 1px solid #17233a; vertical-align: top; }
  table.tbl tbody tr { cursor: pointer; }
  table.tbl tbody tr:hover { background: #16233b; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11.5px; white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .leader { display: flex; gap: 14px; flex-wrap: wrap; }
  .leader .side { flex: 1; min-width: 360px; }

  .footprint { display: grid; grid-template-columns: repeat(auto-fill,minmax(158px,1fr)); gap: 10px; }
  .fp-tile { border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; background: var(--card-2); transition: .15s; position: relative; }
  .fp-tile:hover { border-color: var(--c); box-shadow: var(--shadow); transform: translateY(-1px); }
  .fp-tile.active { border-color: var(--c); }
  .fp-tile.active::after { content: '✓ 已筛选'; position: absolute; top: 8px; right: 10px; font-size: 11px; color: var(--c); font-weight: 700; }
  .fp-flag { font-size: 20px; } .fp-region { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .fp-name { font-weight: 600; margin-top: 5px; font-size: 13px; color: var(--ink); }
  .fp-n { font-size: 18px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .fp-v { font-size: 11px; color: var(--muted); }
  .fp-bar { height: 4px; border-radius: 2px; background: #1d2a40; margin-top: 8px; overflow: hidden; }
  .fp-bar span { display: block; height: 100%; border-radius: 2px; }

  .insight { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 9px 12px; font-size: 12.5px; color: var(--ink-2); margin-top: 10px; line-height: 1.55; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .duo > div { position: relative; }
  .duo .cap { text-align: center; font-size: 11px; color: var(--muted); margin-top: 4px; }

  .size-legend { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin: 6px 0 2px; }
  .size-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .size-legend i { border-radius: 50%; display: inline-block; background: rgba(250,204,21,.45); border: 1px solid var(--accent); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; display: none; align-items: center; justify-content: center; padding: 24px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 16px; max-width: 700px; width: 100%; max-height: 86vh; overflow: auto; padding: 22px; box-shadow: 0 24px 80px rgba(0,0,0,.5); }
  .modal .x { float: right; border: 0; background: #16233b; color: var(--ink-2); border-radius: 8px; cursor: pointer; width: 28px; height: 28px; }
  .deal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .deal-head .vs { color: var(--muted); font-weight: 600; }
  .fact { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 18px; margin: 14px 0; }
  .fact div { font-size: 13px; color: var(--ink); }
  .fact .k { color: var(--muted); font-size: 11.5px; display: block; }
  .note { background: var(--card-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; color: var(--ink-2); line-height: 1.6; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #0b1120; padding: 8px 14px; border-radius: 9px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 200; }
  .toast.show { opacity: 1; }

  @media (max-width: 1100px) {
    .kpis { grid-template-columns: repeat(3, 1fr); }
    .g2, .g3 { grid-template-columns: 1fr; }
    .duo { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="logo" aria-label="Cat Eye">
          <svg viewBox="0 0 36 36" width="28" height="28" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 18 C 10 6, 26 6, 30 18 C 26 30, 10 30, 6 18 Z" fill="#facc15" stroke="#fde047" stroke-width="1.2"/>
            <ellipse cx="18" cy="18" rx="2.3" ry="9.2" fill="#0b1120"/>
            <circle cx="12.5" cy="12" r="2.4" fill="#ffffff"/>
            <circle cx="22" cy="23" r="1.1" fill="#ffffff" opacity="0.75"/>
          </svg>
        </div>
        <div>
          <h1>中国生物医药出海交易洞察</h1>
          <p>China Biopharma Licensing-out Deal Intelligence · 2020–2026 YTD · 演示 Demo</p>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
    </div>
    <div class="filterbar"><div class="filterbar-inner" id="filterbar"></div></div>
  </header>

  <main id="main"></main>

  <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>

<script>

// ===== 常量与中英对照 =====
const MODS = [
  {k:'ADC', label:'ADC 抗体偶联药物', c:'#2dd4bf'},
  {k:'Bispecific', label:'双抗 Bispecific', c:'#60a5fa'},
  {k:'mAb', label:'单抗 mAb', c:'#c084fc'},
  {k:'Small molecule', label:'小分子 Small molecule', c:'#fbbf24'},
  {k:'CAR-T / Cell', label:'细胞疗法 CAR-T/Cell', c:'#f87171'},
  {k:'Peptide/Protein', label:'多肽/蛋白 Peptide/Protein', c:'#34d399'},
  {k:'Fusion protein', label:'融合蛋白 Fusion protein', c:'#a78bfa'},
  {k:'RNA therapy', label:'RNA疗法 RNA therapy', c:'#38bdf8'},
  {k:'Other GTx', label:'基因/溶瘤病毒 Other GTx', c:'#fb923c'},
  {k:'Vaccine', label:'疫苗 Vaccine', c:'#22d3ee'},
  {k:'Other', label:'其他 Other', c:'#94a3b8'}
];
const MODMAP = Object.fromEntries(MODS.map(m => [m.k, m]));
const INDS = ['Oncology','Autoimmune','CNS','Metabolic','Infectious','Rare disease','Respiratory','CV','Ophthalmology','Vaccine','Other'];
const IND_LABEL = {'Oncology':'肿瘤 Oncology','Autoimmune':'自免 Autoimmune','CNS':'中枢神经 CNS','Metabolic':'代谢 Metabolic','Infectious':'感染 Infectious','Rare disease':'罕见病 Rare disease','Respiratory':'呼吸 Respiratory','CV':'心血管 CV','Ophthalmology':'眼科 Ophthalmology','Vaccine':'疫苗 Vaccine','Other':'其他 Other'};
const STAGES = ['Preclinical','IND approved','Phase I','Phase II','Phase III','Registration','Marketed','Multiple Stages','Unknown'];
const STAGE_LABEL = {'Preclinical':'临床前 Preclinical','IND approved':'IND 获批','Phase I':'I 期 Phase I','Phase II':'II 期 Phase II','Phase III':'III 期 Phase III','Registration':'注册阶段 Registration','Marketed':'已上市 Marketed','Multiple Stages':'多阶段 Multiple Stages','Unknown':'未知 Unknown'};
const DTYPES = ['License-out','Co-development','Asset transfer','Non-exclusive','Option','M&A','JV','Distribution','Other'];
const DTYPE_LABEL = {'License-out':'对外授权 License-out','Co-development':'合作开发 Co-development','Asset transfer':'资产转让 Asset transfer','Non-exclusive':'非独占许可 Non-exclusive','Option':'期权协议 Option','M&A':'并购 M&A','JV':'合资 JV','Distribution':'分销 Distribution','Other':'其他 Other'};
const REGIONS = ['US & Canada','Europe','APAC','Emerging Markets','Global','Global ex-Greater China','Japan','South Korea','Greater China','China Mainland','North America','US & Europe','Other'];
const REGION_LABEL = {'US & Canada':'美国+加拿大 US & Canada','Europe':'欧洲 Europe','APAC':'亚太 APAC','Emerging Markets':'新兴市场 Emerging Markets','Global':'全球 Global','Global ex-Greater China':'全球除大中华区 Global ex-Greater China','Japan':'日本 Japan','South Korea':'韩国 South Korea','Greater China':'大中华 Greater China','China Mainland':'中国境内 China Mainland','North America':'北美 North America','US & Europe':'欧美区 US & Europe','Other':'其他 Other'};
const CONF = ['high','high','medium','medium','low'];
const REGION_FLAGS = {'US & Canada':'🇺🇸','Europe':'🇪🇺','APAC':'🌏','Emerging Markets':'🌍','Global':'🌎','Global ex-Greater China':'🌐','Japan':'🇯🇵','South Korea':'🇰🇷','Greater China':'🇨🇳','China Mainland':'🇨🇳','North America':'🌎','US & Europe':'🌐','Other':'🏳️'};

function labelOf(dim, v){
  if(dim==='modality') return MODMAP[v] ? MODMAP[v].label : v;
  if(dim==='indication') return IND_LABEL[v] || v;
  if(dim==='stage') return STAGE_LABEL[v] || v;
  if(dim==='dealType') return DTYPE_LABEL[v] || v;
  if(dim==='region') return REGION_LABEL[v] || v;
  return v;
}

const COUNTRY_REGION = {
  'United States':'US & Canada','Canada':'US & Canada',
  'Germany':'Europe','United Kingdom':'Europe','Switzerland':'Europe','France':'Europe',
  'Japan':'APAC','South Korea':'APAC','Singapore':'APAC','Australia':'APAC',
  'Indonesia':'Emerging Markets','India':'Emerging Markets','Brazil':'Emerging Markets',
  'Global':'Global'
};
const COUNTRY_FLAGS = {'United States':'🇺🇸','Canada':'🇨🇦','Germany':'🇩🇪','United Kingdom':'🇬🇧','Switzerland':'🇨🇭','France':'🇫🇷','Japan':'🇯🇵','South Korea':'🇰🇷','Singapore':'🇸🇬','Australia':'🇦🇺','Indonesia':'🇮🇩','India':'🇮🇳','Brazil':'🇧🇷','Global':'🌎'};

const CN_COMPANIES = ['百济神州 BeiGene','信达生物 Innovent','成都先导 HitGen','英矽智能 Insilico','晶泰科技 XtalPi','天演药业 Adagene','绿叶制药 Luye','百奥泰 Bio-Thera','君实生物 Junshi','沃森生物 Walvax','科伦博泰 Kelun-Biotech','荣昌生物 RemeGen','石药集团 CSPC','科济药业 CARsgen','华东医药 Huadong','上海医药 Shanghai Pharma','济民可信 Jemincare','锐格医药 Regor','诺诚健华 InnoCare','海思科 Haisco'];
const OS_COMPANIES = ['Novartis','Pfizer','Merck KGaA','AstraZeneca','Johnson & Johnson','Roche','Sanofi','Eli Lilly','Gilead','Takeda','Astellas','Daiichi Sankyo','MSD','Bristol Myers Squibb','Boehringer Ingelheim','Amgen','Regeneron','Biogen','Seagen','Samsung Biologics','LG Chem','SK Bioscience','Handok','Etana'];
const TARGETS = ['PD-1','PD-L1','HER2','VEGF','CD19','BCMA','TROP2','CLDN18.2','EGFR','KRAS','GLP-1','IL-17','TNF-α','CD47','BTK','OX40'];
const ASSET_PREFIX = ['SHR','YL','AB','JS','BA','IBI','CM','RC','KD','HH'];

// ===== 可复现的伪随机 =====
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(20261019);
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
function wpick(pairs){ let s=pairs.reduce((x,p)=>x+p[1],0), r=rnd()*s; for(const p of pairs){ r-=p[1]; if(r<=0) return p[0]; } return pairs[pairs.length-1][0]; }
function round2(x){ return Math.round(x*100)/100; }
function fmtM(v){ if(v==null) return '—'; return v >= 1000 ? '$'+(v/1000).toFixed(2)+'B' : '$'+Math.round(v)+'M'; }
function fmtInt(n){ return n.toLocaleString('en-US'); }

// ===== 真实数据加载（data/deals.json）=====
let DEALS = [];
let DATA_LOADED = false;

function normalizeDeal(d){
  return {
    id: d.id, date: d.date, year: d.year,
    licensor: d.licensor || '', licensee: d.licensee || '',
    asset: d.asset || d.drug_name || '', target: d.target || '',
    modality: d.modality, indication: d.indication, stage: d.stage,
    dealType: d.deal_type, region: d.region, territory: d.territory || '',
    confidence: d.confidence || 'unknown',
    upfront: d.upfront_musd, total: d.total_value_musd,
    milestone: d.milestone_musd, milestoneDerivable: d.milestone_derivable,
    disclosed: d.has_total, hasUpfront: d.has_upfront, hasTotal: d.has_total,
    valueDisclosure: d.value_disclosure || '',
    sourceName: d.source_name || '', sourceTitle: d.source_title || '',
    sourceUrl: d.source_url || '', publishDate: d.publish_date || '',
    analystNote: d.analyst_note || ''
  };
}
function loadDeals(json){ DEALS = (json.deals || []).map(normalizeDeal); DATA_LOADED = true; }
async function boot(){
  try {
    const resp = await fetch('/api/deals', {cache:'no-store'});
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    loadDeals(await resp.json());
  } catch(e){
    console.warn('真实数据加载失败，使用空数据兜底:', e);
    DEALS = [];
  }
  render();
}
boot();

// ===== 全局状态 =====
const state = {
  page: 'overview', years: [2020, 2026],
  dealType: new Set(DTYPES), modality: new Set(MODS.map(m=>m.k)),
  indication: new Set(INDS), stage: new Set(STAGES), region: new Set(REGIONS), search: ''
};
function filtered(){
  return DEALS.filter(d =>
    d.year >= state.years[0] && d.year <= state.years[1] &&
    state.dealType.has(d.dealType) && state.modality.has(d.modality) &&
    state.indication.has(d.indication) && state.stage.has(d.stage) && state.region.has(d.region) &&
    (state.search==='' || (d.licensor+d.licensee+d.asset+d.target+d.indication).toLowerCase().includes(state.search.toLowerCase()))
  );
}

const NAV = [
  ['overview','市场概览 Market Overview'], ['landscape','交易格局 Deal Landscape'], ['economics','交易金额 Deal Economics'],
  ['pipeline','技术与管线 Modality & Pipeline'], ['therapy','治疗领域 Therapeutic Areas'], ['companies','交易参与方 Companies'],
  ['explorer','交易数据库 Transaction Explorer']
];
const PAGE_EN = {overview:'Market performance, key events, core metrics and signals', landscape:'Deal count and upfront payment distribution across four dimensions: asset stage, modality, disease area and deal type.', economics:'Upfront, milestones, total value, disclosure rate and value distribution', pipeline:'Market hotspots, deal value, time trends, development maturity, opportunity matrix and asset pipeline', therapy:'Deal activity and trends by disease area', companies:'Licensors, licensees and their deal records & ecosystem network', explorer:'Search individual deals by company, asset, target, date and deal type'};
const DIM_SEG = {overview:'市场分析', landscape:'市场分析', economics:'市场分析', pipeline:'交易内容分析', therapy:'交易内容分析', companies:'交易内容分析', explorer:'数据检索'};

// ===== 过滤器栏 =====
const FILTER_DEFS = [
  {key:'dealType', label:'Deal Type', color:k=>DTYPE_COLORS[k], values:DTYPES},
  {key:'modality', label:'Modality', color:k=>MODMAP[k]?MODMAP[k].c:'#94a3b8', values:MODS.map(m=>m.k)},
  {key:'indication', label:'Therapeutic Area', color:k=>IND_COLORS[k], values:INDS},
  {key:'stage', label:'Asset Stage', color:k=>STAGE_COLORS[k], values:STAGES},
  {key:'region', label:'Region', color:k=>REGION_COLORS[k], values:REGIONS}
];

function buildNav(){
  document.getElementById('nav').innerHTML = NAV.map(([k,l])=>`<button data-page="${k}" class="${state.page===k?'active':''}">${l}</button>`).join('');
}
function buildFilterbar(){
  const years=[2020,2021,2022,2023,2024,2025,2026];
  let html = `<div class="fgroup"><label>Year</label>
    <select class="dd-btn" id="fy0">${years.map(y=>`<option ${y===state.years[0]?'selected':''}>${y}</option>`).join('')}</select>
    <span style="color:var(--muted)">—</span>
    <select class="dd-btn" id="fy1">${years.map(y=>`<option ${y===state.years[1]?'selected':''}>${y}</option>`).join('')}</select></div>`;
  for(const f of FILTER_DEFS){

const AXIS = { axisLine:{lineStyle:{color:'#2a3b55'}}, axisLabel:{color:'#8b9bb0', fontSize:11}, splitLine:{lineStyle:{color:'#1d2a40'}}, nameGap:12 };
const TOOLTIP_DARK = { backgroundColor:'#111827', borderColor:'#223047', textStyle:{color:'#e6edf3', fontSize:12}, confine:true };

function colorOf(dim, v){
  if(dim==='modality') return MODMAP[v]?MODMAP[v].c:'#94a3b8';

function metricVal(d, metric){
  if(metric==='count') return 1; if(metric==='upfront') return d.upfront||0; if(metric==='total') return d.total||0; return 1;
}
const METRIC_LABEL = {count:'交易笔数 Deals', upfront:'首付款 Upfront ($M)', total:'潜在总额 Total ($M)'};

function buildTrend(deals, metric, dim){

    data: years.map(y=>{ const rows=deals.filter(d=>d.year===y && d[dim]===v); return rows.reduce((s,d)=>s+metricVal(d,metric),0); })
  }));

function sum(a){ return a.reduce((s,d)=>s+d,0); }
function median(a){ if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y); const m=Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
function quartiles(a){ if(!a.length) return [0,0,0,0,0]; const s=[...a].sort((x,y)=>x-y); const q=p=>{const i=(s.length-1)*p; const lo=Math.floor(i), hi=Math.ceil(i); return s[lo]+(s[hi]-s[lo])*(i-lo);}; return [s[0], q(.25), q(.5), q(.75), s[s.length-1]]; }

function pieCentered(data, centerTitle, centerSub){
  return { tooltip:{...TOOLTIP_DARK, trigger:'item', formatter:'{b}: {c} ({d}%)'},
    legend:{type:'scroll', bottom:0, icon:'circle', itemWidth:9, itemHeight:9, textStyle:{fontSize:10.5, color:'#cbd5e1'}},
    title:{text:centerTitle, subtext:centerSub||'', left:'center', top:'36%', textStyle:{fontSize:17, color:'#e6edf3', fontWeight:700}, subtextStyle:{fontSize:10.5, color:'#8b9bb0', lineHeight:14}},
    series:[{type:'pie', radius:['40%','64%'], center:['50%','46%'], data, label:{show:false}, emphasis:{scale:true, scaleSize:5}}]};

function keyInsight(deals, dim){
  const total=deals.length, disc=deals.filter(d=>d.hasUpfront);
  const totalUp=sum(disc.map(d=>d.upfront))||1, cov=Math.round(disc.length/total*100);
  const counts={}, ups={};
  deals.forEach(d=>{counts[d[dim]]=(counts[d[dim]]||0)+1;});
  disc.forEach(d=>{ups[d[dim]]=(ups[d[dim]]||0)+d.upfront;});
  const cats=Object.keys(counts);
  const topC=cats.slice().sort((a,b)=>counts[b]-counts[a])[0];
  const topU=Object.keys(ups).sort((a,b)=>ups[b]-ups[a])[0];
  let gap=null, gm=-1;
  cats.forEach(c=>{ const cp=counts[c]/total*100, up=ups[c]?ups[c]/totalUp*100:0; const g=Math.abs(up-cp); if(g>gm){gm=g; gap=c;} });
  const pctC=Math.round(counts[topC]/total*100);
  const pctU=topU ? Math.round(ups[topU]/totalUp*100) : 0;
  const cn = topU
    ? `<b>${labelOf(dim,topC)}</b> 交易数量占比最高（${pctC}%）；<b>${labelOf(dim,topU)}</b> 首付款占比最高（${pctU}%）；数量与金额占比差距最大的是 <b>${labelOf(dim,gap)}</b>。`
    : `<b>${labelOf(dim,topC)}</b> 交易数量占比最高（${pctC}%）；数量与金额占比差距最大的是 <b>${labelOf(dim,gap)}</b>。`;
  const en = topU
    ? `<b>${labelOf(dim,topC)}</b> has the largest deal share (${pctC}%); <b>${labelOf(dim,topU)}</b> has the largest disclosed upfront share (${pctU}%); the largest gap between deal share and upfront share is <b>${labelOf(dim,gap)}</b>.`
    : `<b>${labelOf(dim,topC)}</b> has the largest deal share (${pctC}%); the largest gap between deal share and upfront share is <b>${labelOf(dim,gap)}</b>.`;
  return `<div><b style="color:var(--accent)">关键发现：</b>${cn}</div><div style="margin-top:6px"><b style="color:var(--accent)">Key Insight:</b> ${en}</div>`;
}

const DTYPE_SYMBOL = {'License-out':'circle','Co-development':'diamond','Asset transfer':'triangle','Non-exclusive':'rect','Option':'roundRect','M&A':'pin','JV':'arrow','Other':'rect'};

// ===== 交易金额 · 趋势模块 =====
let ecoGran = 'year';
const YEAR_COLORS = {2019:'#60a5fa',2020:'#2dd4bf',2021:'#fbbf24',2022:'#c084fc',2023:'#f87171',2024:'#34d399',2025:'#22d3ee',2026:'#fb7185'};
function periodKeyParts(dateStr, gran){
  const y=+dateStr.slice(0,4), m=+dateStr.slice(5,7);
  if(gran==='year') return {y, key:String(y), label:String(y)};
  if(gran==='quarter'){ const q=Math.floor((m-1)/3)+1; return {y, key:`${y}-Q${q}`, label:`${y} Q${q}`}; }
  return {y, key:`${y}-${String(m).padStart(2,'0')}`, label:`${y}-${String(m).padStart(2,'0')}`};
}
function trendPeriods(deals, gran){
  const ys=[...new Set(deals.map(d=>d.year))].sort((a,b)=>a-b);
  if(!ys.length) return [];
  const min=ys[0], max=ys[ys.length-1], arr=[];
  if(gran==='year'){ for(let y=min;y<=max;y++) arr.push({key:String(y),label:String(y)}); }
  else if(gran==='quarter'){ for(let y=min;y<=max;y++) for(let q=1;q<=4;q++) arr.push({key:`${y}-Q${q}`,label:`${y} Q${q}`}); }
  else { for(let y=min;y<=max;y++) for(let m=1;m<=12;m++) arr.push({key:`${y}-${String(m).padStart(2,'0')}`,label:`${y}-${String(m).padStart(2,'0')}`}); }
  return arr;
}
function prevPeriodKey(key, gran){
  if(gran==='year') return String(+key-1);
  if(gran==='quarter'){ const [y,q]=key.split('-Q'); return `${+y-1}-Q${q}`; }
  const [y,m]=key.split('-'); return `${+y-1}-${m}`;
}
function trendRows(deals, gran){
  const periods=trendPeriods(deals,gran);
  const map={}; periods.forEach(p=>map[p.key]={key:p.key,label:p.label,count:0,up:0,tot:0,upN:0,totN:0});
  deals.forEach(d=>{ const k=periodKeyParts(d.date,gran).key; if(!map[k]) return; const r=map[k]; r.count++; if(d.hasUpfront){ r.up+=d.upfront||0; r.upN++; }
    if(d.hasTotal){ r.tot+=d.total||0; r.totN++; } });
  return periods.map(p=>{ const r=map[p.key]; const prev=map[prevPeriodKey(p.key,gran)];
    return {key:r.key,label:r.label,count:r.count,up:round2(r.up),tot:round2(r.tot),upN:r.upN,totN:r.totN,
      upRate:r.count?Math.round(r.upN/r.count*100):0, totRate:r.count?Math.round(r.totN/r.count*100):0,
      countYoY:(prev&&prev.count)?(r.count-prev.count)/prev.count*100:null,
      upYoY:(prev&&prev.up)?(r.up-prev.up)/prev.up*100:null,
      totYoY:(prev&&prev.tot)?(r.tot-prev.tot)/prev.tot*100:null};
  });
}
function darken(hex, t){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  const f=1-t*0.6;
  return '#'+((1<<24)+(Math.round(r*f)<<16)+(Math.round(g*f)<<8)+Math.round(b*f)).toString(16).slice(1);
}
function fmtYoY(v){ return v==null?'N/A':(v>=0?'+':'')+v.toFixed(1)+'%'; }
function trendBarOption(rows, metric, color, gran){
  const valKey = metric==='count'?'count':metric==='up'?'up':'tot';
  const yoyKey = metric==='count'?'countYoY':metric==='up'?'upYoY':'totYoY';
  const interval = rows.length>36 ? Math.ceil(rows.length/12) : 0;
  const byYear = gran==='quarter' || gran==='month';
  const yrOf = r => String(r.key).slice(0,4);
  const yearSet = byYear ? [...new Set(rows.map(yrOf))].sort() : [];
  const colorFor = r => byYear ? (YEAR_COLORS[yrOf(r)] || color) : color;
  const option = {
    tooltip:{...TOOLTIP_DARK, trigger:'axis', axisPointer:{type:'shadow'}, formatter: ps=>{
      const r=ps[0].data._r;
      if(metric==='count') return `${r.label}<br/>Deals：<b>${r.count}</b><br/>YoY：${fmtYoY(r.countYoY)}`;

  // 模块3 A/B：年度活跃度折线 + 年度占比 100% 堆叠面积
  mount('pl-trend', { color:modsShown.map(m=>modColor(m.k)), tooltip:{...TOOLTIP_DARK, trigger:'axis'},

    series:modsShown.map(m=>({name:labelOf('modality',m.k), type:'line', smooth:true, symbol:'circle', symbolSize:5, color:modColor(m.k), data:yrs.map(y=>known.filter(d=>d.modality===m.k && d.year===y).length)})) });
  const shareData = {}; yrs.forEach(y=>{ let tot=0; modsShown.forEach(m=>{ const n=known.filter(d=>d.modality===m.k && d.year===y).length; shareData[m.k+y]=n; tot+=n; }); shareData['__tot'+y]=tot; });
  mount('pl-share', { color:modsShown.map(m=>modColor(m.k)), tooltip:{...TOOLTIP_DARK, trigger:'axis', valueFormatter:v=>v+'%'},
    legend:{type:'scroll', top:0, textStyle:{fontSize:10, color:'#cbd5e1'}, itemWidth:10, itemHeight:8},
    grid:{left:16,right:8,top:26,bottom:24,containLabel:true},

    series:modsShown.map(m=>({name:labelOf('modality',m.k), type:'line', stack:'total', smooth:true, symbol:'none', areaStyle:{opacity:.6}, color:modColor(m.k), data:yrs.map(y=>{ const tot=shareData['__tot'+y]||1; return +(shareData[m.k+y]/tot*100).toFixed(1); })})) });

  // 模块3 C：近期增长表
  const recYrs = yrs.slice(-2), prevYrs = yrs.slice(-4,-2);
  const growthRows = modsShown.map(m=>{ const rec=known.filter(d=>d.modality===m.k && recYrs.includes(d.year)).length; const prev=known.filter(d=>d.modality===m.k && prevYrs.includes(d.year)).length; const recTot=known.filter(d=>recYrs.includes(d.year)).length||1; const prevTot=known.filter(d=>prevYrs.includes(d.year)).length||1; return {m:m.k, rec, prev, recShare:+(rec/recTot*100).toFixed(1), prevShare:+(prev/prevTot*100).toFixed(1), chg:rec-prev}; }).sort((a,b)=>b.rec-a.rec);
  document.getElementById('pl-growth').innerHTML = `<table class="tbl"><thead><tr><th>药物形式 Modality</th><th>近期交易笔数 Recent Deals (${recYrs.join(',')})</th><th>近期占比 Recent Share</th><th>上一期间笔数 Prev Deals (${prevYrs.join(',')})</th><th>上一期间占比 Prev Share</th><th>笔数变化 Δ Deals</th></tr></thead><tbody>${growthRows.map(r=>`<tr><td>${tagHtml(modColor(r.m), labelOf('modality',r.m))}</td><td class="num">${r.rec}</td><td class="num">${r.recShare}%</td><td class="num">${r.prev}</td><td class="num">${r.prevShare}%</td><td class="num" style="color:${r.chg>=0?'#2dd4bf':'#f87171'}">${r.chg>=0?'+':''}${r.chg}</td></tr>`).join('')}</tbody></table><div class="hint" style="margin-top:8px">样本量较少的 Modality 增长率仅供参考，不直接认定为持续增长趋势。Small samples are noted; growth rates are indicative only.</div>`;

  // 模块4：Modality × 阶段（笔数/资产切换） + 阶段金额箱线图
  const stagesShown = STAGES.filter(st=>st!=='Unknown');
  const matVal = list => pipeMaturityMetric==='deals' ? list.length : distinctAssets(list);
  mount('pl-maturity', { tooltip:{...TOOLTIP_DARK, trigger:'axis', axisPointer:{type:'shadow'}},
    legend:{type:'scroll', top:0, textStyle:{fontSize:10, color:'#cbd5e1'}, itemWidth:10, itemHeight:8},
    grid:{left:16,right:8,top:26,bottom:24,containLabel:true},
    xAxis:{type:'category', data:modsShown.map(m=>labelOf('modality',m.k)), ...AXIS, axisLabel:{...AXIS.axisLabel, rotate:18}}, yAxis:{type:'value', ...AXIS},
    series:stagesShown.map(st=>({name:labelOf('stage',st), type:'bar', stack:'total', itemStyle:{color:STAGE_COLORS[st]}, data:modsShown.map(m=>matVal(known.filter(d=>d.modality===m.k && d.stage===st)))})) });
  wireSwitch('pl-mat-metric', {deals:'交易笔数 Deals', assets:'去重资产 Assets'}, pipeMaturityMetric, v=>{ pipeMaturityMetric=v; render(); });
  const stagesPresent = stagesShown.filter(st=>disc.some(d=>d.stage===st));
  mount('pl-stagebox', { tooltip:{...TOOLTIP_DARK, trigger:'item'},
    grid:{left:16,right:8,top:24,bottom:24,containLabel:true},
    xAxis:{type:'category', data:stagesPresent.map(s=>labelOf('stage',s)), name:'研发阶段 Stage', nameTextStyle:{color:'#8b9bb0'}, ...AXIS, axisLabel:{...AXIS.axisLabel, rotate:18}},
    yAxis:{type:'value', ...AXIS, name:'US$M', nameTextStyle:{color:'#8b9bb0'}},
    series:[{type:'boxplot', data:stagesPresent.map(st=>quartiles(disc.filter(d=>d.stage===st).map(d=>d.total))), itemStyle:{color:'#facc15', borderColor:'#fde047'}, boxWidth:[12,26]}] });


  // 资产管线表（保留）
  const assets={}; deals.forEach(d=>{ if(!assets[d.asset]) assets[d.asset]={asset:d.asset, target:d.target, modality:d.modality, indication:d.indication, licensor:d.licensor, stage:d.stage, total:0, n:0}; const a=assets[d.asset]; a.n++; a.total=Math.max(a.total, d.total||0); });
  const si=s=>STAGES.indexOf(s);
  const alist=Object.values(assets).sort((a,b)=>(b.total||0)-(a.total||0)).slice(0,16);
  document.getElementById('pl-assets').innerHTML = `<table class="tbl"><thead><tr><th>资产 Asset</th><th>药物形式 Modality</th><th>靶点 Target</th><th>治疗领域 Therapeutic Area</th><th>研发阶段 Stage</th><th>中国授权方 Licensor</th><th>关联交易金额 Associated Deal Value</th><th>关联交易笔数 Deals</th></tr></thead><tbody>
    ${alist.map(a=>`<tr onclick="state.page='explorer';state.search='${a.asset}';render();"><td>${a.asset}</td><td>${tagHtml(modColor(a.modality), labelOf('modality',a.modality))}</td><td>${a.target}</td><td>${labelOf('indication',a.indication)}</td><td>${labelOf('stage',a.stage)}</td><td>${a.licensor}</td><td class="num">${fmtM(a.total)}</td><td class="num">${a.n}</td></tr>`).join('')}
  </tbody></table>`;
}

// ===== 治疗领域 =====
let therapyArea = 'Oncology';
let therapyOppValue = 'medianTotal';
const AREA_HOTSPOTS = {Oncology:['肺癌 NSCLC','乳腺癌 Breast','卵巢癌 Ovarian','胃癌 Gastric','血液瘤 Hematologic'], Autoimmune:['类风湿关节炎 RA','银屑病 Psoriasis','狼疮 SLE','炎症性肠病 IBD'], CNS:['阿尔茨海默 AD','帕金森 PD','疼痛 Pain','抑郁症 MDD'], Metabolic:['肥胖 Obesity','糖尿病 Diabetes','NASH/MASH','高血脂 Dyslipidemia'], Infectious:['HBV','HIV','流感 Influenza','抗感染 Anti-infective'], 'Rare disease':['罕见肿瘤','溶酶体贮积症','血友病 Hemophilia'], Vaccine:['新冠 COVID','流感疫苗','RSV'], Other:['其他']};

function renderTherapy(deals){
  main.innerHTML = title('治疗领域 Therapeutic Areas', PAGE_EN.therapy) +
  `<div class="grid g2">
    <div class="card"><h3><span class="zh">治疗趋势</span> <span class="en">Disease Area Trends</span></h3><p class="hint">各治疗领域的年度交易数量变化。Annual deal count trends by therapeutic area.</p><div id="th-trend" class="chart ch-lg"></div></div>
    <div class="card"><h3><span class="zh">适应症热点</span> <span class="en">Indication Hotspots</span></h3><p class="hint">各领域内热门具体适应症。Hot specific indications within each area.</p><div id="th-hot"></div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3><span class="zh">深入分析</span> <span class="en">Deep Dive</span></h3>
    <p class="hint">选择单个治疗领域，查看其药物形式、研发阶段、公司与交易结构。Select one therapeutic area to explore its modality, stage, companies and deal structure.</p>
    <div style="margin-bottom:10px"><select class="dd-btn" id="th-area">${INDS.map(i=>`<option ${i===therapyArea?'selected':''}>${i}</option>`).join('')}</select></div>
    <div class="grid g2"><div id="th-mod" class="chart ch-md"></div><div id="th-stage" class="chart ch-md"></div></div>
    <div id="th-co" style="margin-top:10px"></div></div>

  <div class="card" style="margin-top:14px"><h3><span class="zh">综合机会矩阵</span> <span class="en">Opportunity Matrix · Indication × Modality</span></h3>
    <p class="hint">识别不同适应症与技术类型的交易热点、潜在高价值机会及竞争格局。Identifies deal hotspots, potential high-value opportunities and competitive landscape across indications and modalities.</p>
    <div class="metric-switch" id="th-opp-value"></div>
    <div id="th-opp" class="chart ch-lg"></div><div class="hint" style="margin-top:8px">X=标准化交易活跃度；Y=单笔金额中位数；气泡大小=交易笔数；颜色=近期增长趋势；虚线=样本中位数（四象限：高热度高价值 / 低热度高价值 / 高热度低价值 / 低热度低价值）。X=standardized activity; Y=median deal value; size=deal count; color=recent growth; dashed lines=median thresholds.</div></div>`;

  mount('th-trend', buildTrend(deals, 'count', 'indication'));
  document.getElementById('th-hot').innerHTML = `<table class="tbl"><thead><tr><th>治疗领域 Therapeutic Area</th><th>交易笔数 Deals</th><th>热门具体适应症 Indication Hotspots</th></tr></thead><tbody>
    ${INDS.map(i=>{ const n=deals.filter(d=>d.indication===i).length; return `<tr><td>${labelOf('indication',i)}</td><td class="num">${n}</td><td>${(AREA_HOTSPOTS[i]||[]).map(h=>tagHtml('#334155',h)).join(' ')}</td></tr>`; }).join('')}
  </tbody></table>`;
  document.getElementById('th-area').onchange = e=>{ therapyArea=e.target.value; render(); };

  const sub = deals.filter(d=>d.indication===therapyArea);
  mount('th-mod', barOption(sub, 'modality', Object.fromEntries(MODS.map(m=>[m.k,m.c]))));
  mount('th-stage', barOption(sub, 'stage', STAGE_COLORS));
  const co={}; sub.forEach(d=>{ if(!co[d.licensor]) co[d.licensor]={n:0,total:0}; co[d.licensor].n++; if(d.disclosed) co[d.licensor].total+=d.total; });
  const coRows=Object.entries(co).sort((a,b)=>b[1].n-a[1].n).slice(0,10);
  document.getElementById('th-co').innerHTML = `<table class="tbl"><thead><tr><th>中国授权方 Licensor（${labelOf('indication',therapyArea)}）</th><th>交易笔数 Deals</th><th>披露总额 Disclosed Value</th></tr></thead><tbody>${coRows.map(([k,v])=>`<tr><td>${k}</td><td class="num">${v.n}</td><td class="num">${fmtM(v.total)}</td></tr>`).join('')}</tbody></table>`;
  // 综合机会矩阵：Indication × Modality
  const knownTm = deals.filter(d=>d.modality && d.modality!=='Other' && d.modality!=='Unknown' && d.indication && d.indication!=='Other' && d.indication!=='Unknown');
  const tmComboMap = {};
  knownTm.forEach(d=>{ const k=d.indication+' | '+d.modality; if(!tmComboMap[k]) tmComboMap[k]={indication:d.indication, modality:d.modality, list:[]}; tmComboMap[k].list.push(d); });
  const tmList = Object.values(tmComboMap).map(c=>{ const dl=c.list.filter(d=>d.disclosed); return {indication:c.indication, modality:c.modality, list:c.list, n:c.list.length, medianTotal:median(dl.map(d=>d.total)), medianUp:median(dl.map(d=>d.upfront)), total:sum(dl.map(d=>d.total)), discN:dl.length, assets:new Set(c.list.map(d=>d.asset).filter(Boolean)).size}; }).filter(c=>c.medianTotal>0 || c.medianUp>0);
  const tYrs = [...new Set(knownTm.map(d=>d.year))].sort((a,b)=>a-b);
  const tComplete = tYrs.slice(0,-1), tRecent3 = tComplete.slice(-3), tPrev3 = tComplete.slice(-6,-3);
  const tMaxN = Math.max(1, ...tmList.map(c=>c.n));
  const TMCATS = ['增长','稳定','下降','新兴'];
  const TMCAT_COLOR = {'增长':'#facc15','稳定':'#94a3b8','下降':'#f87171','新兴':'#60a5fa'};
  const TMCAT_EN = {'增长':'Growth','稳定':'Stable','下降':'Decline','新兴':'Emerging/Insufficient'};
  const tmRows = tmList.map(c=>{
    const r=c.list.filter(d=>tRecent3.includes(d.year)).length;
    const p=c.list.filter(d=>tPrev3.includes(d.year)).length;

  });

  const tmSeries = TMCATS.map(cat=>({name:`${cat} ${TMCAT_EN[cat]}`, type:'scatter', data:tmRows.filter(r=>r.cat===cat).map(r=>({value:[r.act,r.val], _r:r})), itemStyle:{color:TMCAT_COLOR[cat]}, symbolSize:function(v,p){return 10+Math.sqrt(p.data._r.n||1)*5;}}));
  if(tmSeries.length) tmSeries[0].markLine = {silent:true, symbol:'none', lineStyle:{color:'#334155', type:'dashed'}, data:[{xAxis:tmMedX},{yAxis:tmMedY}]};
  const thOppChart = mount('th-opp', {
    tooltip:{...TOOLTIP_DARK, formatter:p=>{ const r=p.data._r; return `<b>${labelOf('indication',r.indication)} × ${labelOf('modality',r.modality)}</b><br/>交易笔数 Deals：<b>${r.n}</b><br/>去重资产 Assets：<b>${r.assets}</b><br/>单笔金额中位数 Median Total：<b>${fmtM(r.medianTotal)}</b><br/>首付款中位数 Median Upfront：<b>${fmtM(r.medianUp)}</b><br/>披露率 Disclosure：<b>${r.discRate}%</b>（${r.discN}/${r.n}）<br/>近期/此前 Recent/Prev：<b>${r.r}</b> / <b>${r.p}</b><br/>趋势 Growth：<b>${r.cat}</b>`; }},
    legend:{top:0, data:tmSeries.map(x=>x.name), textStyle:{fontSize:10, color:'#cbd5e1'}, itemWidth:10, itemHeight:8},
    grid:{left:16,right:16,top:30,bottom:32,containLabel:true},
    xAxis:{type:'value', ...AXIS, name:'交易活跃度 Activity（标准化）', nameTextStyle:{color:'#8b9bb0'}, scale:true},
    yAxis:{type:'value', ...AXIS, name: therapyOppValue==='medianTotal' ? '交易价值 Median Total (US$M)' : '交易价值 Median Upfront (US$M)', nameTextStyle:{color:'#8b9bb0'}, scale:true},
    series:tmSeries
  });
  if(thOppChart) thOppChart.on('click', p=>{ if(p.data && p.data._r){ openIndMod(p.data._r.indication, p.data._r.modality); } });
  wireSwitch('th-opp-value', {medianTotal:'Y=中位总金额 Median Total', medianUp:'Y=首付款中位数 Median Upfront'}, therapyOppValue, v=>{ therapyOppValue=v; render(); });
}

// ===== 交易参与方（含生态网络方块）=====
let coSort='deals', coSort2='deals';
const SORT_LABELS = {deals:'交易笔数 Deals', total:'披露总额 Disclosed Value', median:'中位数金额 Median', mods:'药物形式数 Modalities', inds:'治疗领域数 Therapeutic Areas'};

function companyStats(deals, key){
  const map=new Map();
  deals.forEach(d=>{ const name=d[key];
    if(!map.has(name)) map.set(name,{name,deals:0,total:0,vals:[],mods:new Set(),inds:new Set()});
    const c=map.get(name); c.deals++; c.mods.add(d.modality); c.inds.add(d.indication); if(d.disclosed){ c.total+=d.total; c.vals.push(d.total); } });
  return [...map.values()].map(c=>({name:c.name,deals:c.deals,total:round2(c.total),median:round2(median(c.vals)),mods:c.mods.size,inds:c.inds.size}));
}
function sortCompanies(arr, sort){
  const key = sort==='median'?'median':sort==='total'?'total':sort==='mods'?'mods':sort==='inds'?'inds':'deals';
  return arr.slice().sort((a,b)=>b[key]-a[key]);
}
function leaderTableHtml(rows, sort){
  return `<select class="dd-btn" onchange="__companySort(this)">${Object.entries(SORT_LABELS).map(([k,l])=>`<option value="${k}" ${sort===k?'selected':''}>Sort by: ${l}</option>`).join('')}</select>
  <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>公司 Company</th><th>交易 Deals</th><th>披露总额 Value</th><th>中位数 Median</th><th>药物形式 Modality</th><th>治疗领域 Areas</th></tr></thead><tbody>
  ${rows.slice(0,12).map(r=>`<tr><td>${r.name}</td><td class="num">${r.deals}</td><td class="num">${fmtM(r.total)}</td><td class="num">${fmtM(r.median)}</td><td class="num">${r.mods}</td><td class="num">${r.inds}</td></tr>`).join('')}
  </tbody></table></div>`;
}
window.__companySort = function(sel){
  const side = sel.closest('.side').querySelector('h3').textContent.includes('中国') ? 'cn' : 'os';
  if(side==='cn') coSort=sel.value; else coSort2=sel.value; render();
};

function buildNetworkOption(deals){
  const nm=new Map(), em=new Map();
  deals.forEach(d=>{
    [['cn',d.licensor],['os',d.licensee]].forEach(([side,name])=>{ if(!nm.has(name)) nm.set(name,{name,cn:side==='cn',cnt:0}); nm.get(name).cnt++; });
    const key=d.licensor+'|'+d.licensee; if(!em.has(key)) em.set(key,{s:d.licensor,t:d.licensee,v:0}); em.get(key).v++;
  });
  const nodes=[...nm.values()].map(n=>({id:n.name,name:n.name,category:n.cn?0:1,symbolSize:12+Math.sqrt(n.cnt)*5,itemStyle:{color:n.cn?'#2dd4bf':'#60a5fa'}}));
  const edges=[...em.values()].map(e=>({source:e.s,target:e.t,value:e.v,lineStyle:{width:Math.min(1+e.v,8),color:'#334155',curveness:0.12}}));
  const option = { tooltip:{...TOOLTIP_DARK, formatter:p=>p.dataType==='edge'?`${p.data.source} ↔ ${p.data.target}<br/>交易：<b>${p.data.value}</b>`:`${p.name}<br/>交易：<b>${nm.get(p.name).cnt}</b>`},
    legend:[{data:['中国公司','海外公司'], bottom:8, textStyle:{fontSize:11, color:'#cbd5e1'}}],
    series:[{type:'graph', layout:'force', roam:true, draggable:true, force:{repulsion:260, edgeLength:110, gravity:0.08}, categories:[{name:'中国公司'},{name:'海外公司'}], label:{show:true, fontSize:10, color:'#cbd5e1'}, data:nodes, edges, emphasis:{focus:'adjacency', lineStyle:{width:6}}}]
  };
  return {option, nm};
}

function renderCompanies(deals){
  const cn=companyStats(deals,'licensor'), os=companyStats(deals,'licensee');
  const cnSorted=sortCompanies(cn,coSort), osSorted=sortCompanies(os,coSort2);
  main.innerHTML = title('交易参与方 Companies', PAGE_EN.companies) +
  `<div class="leader">
    <div class="side card"><h3><span class="zh">中国授权方</span> <span class="en">Licensors</span></h3><p class="hint">不做武断排名，可按多指标切换排序</p><div id="co-cn"></div></div>
    <div class="side card"><h3><span class="zh">海外引进方</span> <span class="en">Overseas Licensees</span></h3><p class="hint">与中国交易的海外公司</p><div id="co-os"></div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3><span class="zh">公司 × 药物形式</span> <span class="en">Company × Modality</span></h3><p class="hint">展示不同公司在各类药物形式上的交易布局与活跃程度，识别公司的技术布局差异及潜在合作方向。</p><div id="co-bubble" class="chart ch-md"></div><div class="hint" style="margin-top:8px">气泡大小 = 交易笔数；颜色 = 药物形式（与全站配色一致）。Bubble size = deal count; color = modality.</div></div>
  <div class="card" style="margin-top:14px"><h3><span class="zh">生态网络</span> <span class="en">Network</span></h3><p class="hint">节点=公司（<span style="color:#2dd4bf">● 中国</span> / <span style="color:#60a5fa">● 海外</span>），大小=交易笔数，连线=交易；可拖拽/缩放，点击节点查看公司档案</p><div id="co-net" class="chart" style="height:440px"></div></div>`;
  document.getElementById('co-cn').innerHTML = leaderTableHtml(cnSorted, coSort);
  document.getElementById('co-os').innerHTML = leaderTableHtml(osSorted, coSort2);
  // 公司 × 药物形式
  const top=cnSorted.slice(0,12); const xd=MODS.map(m=>m.k); const bub=[];
  top.forEach((c,yi)=>MODS.forEach((m,xi)=>{ const n=deals.filter(d=>d.licensor===c.name&&d.modality===m.k).length; if(n>0) bub.push({value:[xi, top.length-1-yi], n, company:c.name, modality:m.k, itemStyle:{color:m.c}}); }));
  mount('co-bubble', {
    tooltip:{...TOOLTIP_DARK, formatter:p=>`${p.data.company}<br/>${labelOf('modality',p.data.modality)}：<b>${p.data.n}</b> 笔`},
    grid:{left:8,right:8,top:12,bottom:8,containLabel:true},
    xAxis:{type:'category', data:xd.map(m=>labelOf('modality',m)), ...AXIS, axisLabel:{...AXIS.axisLabel, rotate:18}},
    yAxis:{type:'category', data:top.map(c=>c.name).reverse(), ...AXIS, axisLabel:{fontSize:11}},
    series:[{type:'scatter', data:bub, symbolSize:function(v,p){return 8+Math.sqrt(p.data.n)*7;}}]
  });
  const {option}=buildNetworkOption(deals);
  const c=mount('co-net', option);
  c.on('click', p=>{ if(p.dataType==='node') openCompany(p.name); });
}

function closeDeal(){ document.getElementById('modalOverlay').classList.remove('open'); }

function openCombo(target, modality){
  const list = DEALS.filter(d=>d.target===target && d.modality===modality);
  if(!list.length) return;
  const disc = list.filter(d=>d.disclosed);
  const medTotal = median(disc.map(d=>d.total));
  const medUp = median(disc.map(d=>d.upfront));
  const totalV = sum(disc.map(d=>d.total));
  const assets = new Set(list.map(d=>d.asset).filter(Boolean)).size;
  const stages = {};
  list.forEach(d=>{ stages[d.stage]=(stages[d.stage]||0)+1; });
  const stageTxt = Object.entries(stages).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,n])=>`${labelOf('stage',k)} ${n}`).join(' · ');
  const rows = list.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
  document.getElementById('modal').innerHTML = `
    <button class="x" onclick="closeDeal()">✕</button>
    <div class="deal-head"><b>${target} × ${labelOf('modality',modality)}</b></div>
    <div class="fact">
      <div><span class="k">交易笔数 Deals</span>${list.length}</div>
      <div><span class="k">去重资产 Assets</span>${assets}</div>
      <div><span class="k">披露总额 Total</span>${fmtM(totalV)}</div>
      <div><span class="k">披露率 Disclosure</span>${Math.round(disc.length/list.length*100)}%（${disc.length}/${list.length}）</div>
      <div><span class="k">中位总金额 Median Total</span>${fmtM(medTotal)}</div>
      <div><span class="k">首付款中位数 Median Upfront</span>${fmtM(medUp)}</div>
    </div>
    <div class="note">阶段分布：${stageTxt||'—'}</div>
    <div class="note" style="margin-top:6px">相关交易（点击查看详情）：</div>
    <table class="tbl" style="margin-top:8px"><tbody>${rows.map(r=>`<tr onclick="openDeal('${r.id}')"><td class="num">${r.date}</td><td>${r.asset}</td><td>${r.licensor}</td><td>${r.licensee}</td><td class="num">${fmtM(r.total)}</td></tr>`).join('')}</tbody></table>
    <div style="margin-top:14px;display:flex;gap:10px;justify-content:flex-end">
      <button class="dd-btn" onclick="state.page='explorer';state.search='${target}';render();closeDeal();">在交易数据库中查看</button>
      <button class="dd-btn" style="background:var(--accent);color:#1c1700;border-color:var(--accent);font-weight:600" onclick="closeDeal()">关闭</button>
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
}

      <div><span class="k">交易笔数 Deals</span>${list.length}</div>
      <div><span class="k">去重资产 Assets</span>${assets}</div>
      <div><span class="k">披露总额 Total</span>${fmtM(totalV)}</div>
      <div><span class="k">披露率 Disclosure</span>${Math.round(disc.length/list.length*100)}%（${disc.length}/${list.length}）</div>
      <div><span class="k">中位总金额 Median Total</span>${fmtM(medTotal)}</div>

    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
}

function openCompany(name){
  const all=DEALS;
  const lic=companyStats(all,'licensor').find(c=>c.name===name);
  const os=companyStats(all,'licensee').find(c=>c.name===name);
  const c=lic||os; if(!c) return; const isCn=!!lic;
  const rows=all.filter(d=>d.licensor===name||d.licensee===name).sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('modal').innerHTML = `
    <button class="x" onclick="closeDeal()">✕</button>
    <div class="deal-head"><b>${name}</b><span class="vs">${isCn?'中国授权方':'海外对手方'}</span></div>
    <div class="fact">
      <div><span class="k">交易笔数</span>${c.deals}</div><div><span class="k">披露总额</span>${fmtM(c.total)}</div>
      <div><span class="k">中位数金额</span>${fmtM(c.median)}</div><div><span class="k">药物形式数</span>${c.mods}</div>
      <div><span class="k">治疗领域数</span>${c.inds}</div><div><span class="k">最近交易</span>${rows[0]?rows[0].date:'—'}</div>

    <div class="note">最近交易（点击查看详情）：</div>

      <button class="dd-btn" style="background:var(--accent);color:#1c1700;border-color:var(--accent);font-weight:600" onclick="closeDeal()">关闭</button>
    </div>`;

// ===== 导航 / 过滤 / 渲染 =====
function renderMain(){
  clearCharts();
  const deals=filtered();
  const pages={overview:renderOverview, landscape:renderLandscape, economics:renderEconomics, pipeline:renderPipeline, therapy:renderTherapy, companies:renderCompanies, explorer:renderExplorer};
  (pages[state.page]||renderOverview)(deals);
}
function syncNav(){ document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.page===state.page)); }
function syncFilterbar(){
  document.querySelectorAll('[data-dd]').forEach(btn=>{ const k=btn.dataset.dd; const def=FILTER_DEFS.find(f=>f.key===k); const n=state[k].size===def.values.length?'全部':state[k].size+' 项'; btn.innerHTML=`${def.label} <span class="n">${n}</span> ▾`; });
  document.querySelectorAll('[data-fk]').forEach(cb=>{ const k=cb.dataset.fk, v=cb.dataset.fv; cb.checked=state[k].has(v); });
  document.getElementById('fy0').value=state.years[0]; document.getElementById('fy1').value=state.years[1];
}
function render(){ buildNav(); buildFilterbar(); wireNav(); wireFilterbar(); renderMain(); }
function refresh(){ syncNav(); syncFilterbar(); renderMain(); }

function wireNav(){
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{ state.page=b.dataset.page; refresh(); });
}
function wireFilterbar(){
  const bar=document.getElementById('filterbar');
  bar.querySelectorAll('[data-dd]').forEach(btn=>btn.onclick=e=>{ e.stopPropagation(); const menu=bar.querySelector(`[data-menu="${btn.dataset.dd}"]`); const was=menu.classList.contains('open'); bar.querySelectorAll('.dd-menu').forEach(m=>m.classList.remove('open')); if(!was) menu.classList.add('open'); });
  bar.querySelectorAll('[data-menu]').forEach(m=>m.addEventListener('click', e=>e.stopPropagation()));
  bar.querySelectorAll('[data-fk]').forEach(cb=>cb.onchange=()=>{ const k=cb.dataset.fk, v=cb.dataset.fv; if(cb.checked) state[k].add(v); else state[k].delete(v); refresh(); });
  document.getElementById('fy0').onchange=e=>{ state.years[0]=+e.target.value; if(state.years[0]>state.years[1]) state.years[1]=state.years[0]; refresh(); };
  document.getElementById('fy1').onchange=e=>{ state.years[1]=+e.target.value; if(state.years[1]<state.years[0]) state.years[0]=state.years[1]; refresh(); };
  document.getElementById('freset').onclick=()=>{ resetFilters(); render(); };
}
function resetFilters(){
  state.years=[2020,2026];
  state.dealType=new Set(DTYPES); state.modality=new Set(MODS.map(m=>m.k));
  state.indication=new Set(INDS); state.stage=new Set(STAGES); state.region=new Set(REGIONS); state.search='';
}
document.addEventListener('click', ()=>{ document.querySelectorAll('.dd-menu').forEach(m=>m.classList.remove('open')); });
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeDeal(); });
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'), 1800); }

// ===== 启动（render 由 boot() 在数据加载完成后调用）=====
</script>
